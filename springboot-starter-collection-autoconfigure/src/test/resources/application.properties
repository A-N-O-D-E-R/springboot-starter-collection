# The test classpath holds every optional feature module; only security is under test here.
spring.autoconfigure.exclude=com.anode.autoconfiguration.b2.B2AutoConfiguration,\
  com.anode.autoconfiguration.plugin.PluginAutoConfiguration,\
  com.anode.autoconfiguration.modbus.ModbusAutoConfiguration,\
  com.anode.autoconfiguration.redis.RedisAutoConfiguration
# the Zabbix agent binds a fixed port: one per cached Spring test context collides
zabbix.enabled=false
