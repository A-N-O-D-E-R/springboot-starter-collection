# Shared CI for every A-N-O-D-E-R app. Call it from the app's own workflow:
#
#   jobs:
#     ci:
#       uses: A-N-O-D-E-R/springboot-starter-collection/.github/workflows/reusable-ci.yml@v0.2.0
#       with: { frontend-dir: frontend, image-name: ghcr.io/a-n-o-d-e-r/my-app }
#       permissions: { contents: read, packages: write }
name: Reusable CI
on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '25'
      node-version:
        type: string
        default: '24'
      pnpm-version:
        type: string
        default: '10'
      maven-args:
        description: Arguments of the Maven build (Docker is available for Testcontainers).
        type: string
        default: 'verify'
      maven-pre-command:
        description: "Shell command run before Maven, e.g. to build a Docker image the integration tests use. Empty: none."
        type: string
        default: ''
      maven-dir:
        description: "Directory of the root pom.xml. Empty: no backend job."
        type: string
        default: '.'
      frontend-dir:
        description: "Directory of the pnpm project (lint, test, build). Empty: no frontend job."
        type: string
        default: ''
      image-name:
        description: "GHCR image, e.g. ghcr.io/a-n-o-d-e-r/my-app. Empty: no image job."
        type: string
        default: ''
      dockerfile:
        type: string
        default: 'Dockerfile'
      push-image:
        description: Push the image (only from the default branch, whatever this says).
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  backend:
    if: inputs.maven-dir != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven
      - name: Before Maven
        if: inputs.maven-pre-command != ''
        run: bash -ec "$PRE_COMMAND"
        env:
          PRE_COMMAND: ${{ inputs.maven-pre-command }}
      - run: mvn --batch-mode --no-transfer-progress ${{ inputs.maven-args }}
        working-directory: ${{ inputs.maven-dir }}

  frontend:
    if: inputs.frontend-dir != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.frontend-dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.frontend-dir }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  image:
    # a skipped job (no backend / no frontend) must not block the image; a failed or cancelled one must
    if: ${{ !cancelled() && inputs.image-name != '' && !contains(needs.*.result, 'failure') }}
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.push-image && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: ${{ inputs.push-image && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
